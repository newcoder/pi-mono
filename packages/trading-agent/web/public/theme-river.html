<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Market Theme River — A股主线演化</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0f1117; color: #e0e0e0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  .header { padding: 20px 24px 0; display: flex; justify-content: space-between; align-items: center; }
  .header h1 { font-size: 20px; font-weight: 600; }
  .header .sub { font-size: 13px; color: #888; margin-top: 4px; }
  .controls { display: flex; gap: 8px; }
  .controls button { padding: 6px 14px; border: 1px solid #333; background: #1a1d2b; color: #aaa; border-radius: 6px; cursor: pointer; font-size: 13px; }
  .controls button.active { background: #2563eb; border-color: #2563eb; color: #fff; }
  #river { width: 100%; height: 520px; }
  #heatmap { width: 100%; height: 420px; }
  .footer { padding: 8px 24px 20px; font-size: 12px; color: #555; }
</style>
</head>
<body>
<div class="header">
  <div>
    <h1>A股市场主线演化</h1>
    <div class="sub">数据源：同花顺热门股入选理由 · 按周聚合 · 2024-01 ~ 2026-07</div>
  </div>
  <div class="controls">
    <button id="btn-primary" class="active" onclick="switchLevel('primary')">主线</button>
    <button id="btn-all" onclick="switchLevel('')">全部</button>
  </div>
</div>
<div id="river"></div>
<div id="heatmap"></div>
<div class="footer">鼠标悬停查看详情 · 主线=周提及≥15次 · 颜色越深提及越多</div>

<script>
const COLORS = [
  '#3b82f6','#ef4444','#22c55e','#f59e0b','#8b5cf6',
  '#06b6d4','#ec4899','#84cc16','#f97316','#6366f1',
  '#14b8a6','#e11d48','#a855f7','#0ea5e9','#d946ef',
  '#10b981','#f43f5e','#64748b','#eab308','#3b82f6'
];

let currentLevel = 'primary';

function switchLevel(level) {
  currentLevel = level;
  document.getElementById('btn-primary').classList.toggle('active', level === 'primary');
  document.getElementById('btn-all').classList.toggle('active', level === '');
  loadData();
}

async function loadData() {
  const url = currentLevel ? `/api/theme-history?level=${currentLevel}` : '/api/theme-history';
  const res = await fetch(url);
  const rows = await res.json();
  if (!rows.length) return;

  const dates = [...new Set(rows.map(r => r.snapshot_date))].sort();
  const themeSet = new Map();
  rows.forEach(r => {
    if (!themeSet.has(r.theme)) themeSet.set(r.theme, { total: 0, weeks: 0, max: 0 });
    const t = themeSet.get(r.theme);
    t.total += r.mentions;
    t.weeks++;
    t.max = Math.max(t.max, r.mentions);
  });

  // Top 15 themes by total mentions for river chart
  const topThemes = [...themeSet.entries()]
    .sort((a, b) => b[1].total - a[1].total)
    .slice(0, 15)
    .map(([name]) => name);

  renderRiver(rows, dates, topThemes);
  renderHeatmap(rows, dates);
}

function renderRiver(rows, dates, topThemes) {
  const seriesData = topThemes.map(theme => {
    const dateMap = new Map();
    rows.filter(r => r.theme === theme).forEach(r => dateMap.set(r.snapshot_date, r.mentions));
    return {
      name: theme,
      type: 'line',
      stack: 'total',
      areaStyle: {},
      emphasis: { focus: 'series' },
      data: dates.map(d => dateMap.get(d) || 0),
    };
  });

  const chart = echarts.init(document.getElementById('river'));
  chart.setOption({
    tooltip: { trigger: 'axis', backgroundColor: '#1a1d2b', borderColor: '#333', textStyle: { color: '#e0e0e0', fontSize: 12 } },
    legend: { bottom: 0, textStyle: { color: '#888', fontSize: 11 }, data: topThemes, type: 'scroll' },
    grid: { left: 50, right: 30, top: 20, bottom: 50 },
    xAxis: { type: 'category', data: dates, axisLabel: { color: '#666', fontSize: 10, formatter: v => v.slice(2) }, axisLine: { lineStyle: { color: '#222' } } },
    yAxis: { type: 'value', name: '提及次数', nameTextStyle: { color: '#666', fontSize: 11 }, axisLabel: { color: '#666' }, splitLine: { lineStyle: { color: '#1a1d2b' } } },
    series: seriesData,
    color: COLORS,
  });
  window.addEventListener('resize', () => chart.resize());
}

function renderHeatmap(rows, dates) {
  const allThemes = [...new Set(rows.map(r => r.theme))];
  const chart = echarts.init(document.getElementById('heatmap'));

  const data = [];
  const dateIdx = new Map(dates.map((d, i) => [d, i]));
  const themeIdx = new Map(allThemes.map((t, i) => [t, i]));

  rows.forEach(r => {
    data.push([dateIdx.get(r.snapshot_date), themeIdx.get(r.theme), r.mentions]);
  });

  chart.setOption({
    tooltip: {
      backgroundColor: '#1a1d2b', borderColor: '#333',
      textStyle: { color: '#e0e0e0', fontSize: 12 },
      formatter: p => `${p.value[2]} mentions: <b>${allThemes[p.value[1]]}</b><br/>${dates[p.value[0]]}`
    },
    grid: { left: 100, right: 30, top: 10, bottom: 60 },
    xAxis: {
      type: 'category', data: dates,
      axisLabel: { color: '#666', fontSize: 9, formatter: v => v.slice(2), rotate: 45 },
      axisLine: { lineStyle: { color: '#222' } }
    },
    yAxis: {
      type: 'category', data: allThemes,
      axisLabel: { color: '#aaa', fontSize: 11 },
    },
    visualMap: {
      min: 0, max: 50, calculable: true,
      orient: 'horizontal', left: 'center', bottom: 0,
      inRange: { color: ['#1a1d2b', '#1e3a5f', '#2563eb', '#60a5fa', '#93c5fd'] },
      textStyle: { color: '#888' }
    },
    series: [{
      type: 'heatmap', data: data,
      label: { show: false },
      emphasis: { itemStyle: { shadowBlur: 10, shadowColor: 'rgba(0,0,0,0.5)' } }
    }]
  });
  window.addEventListener('resize', () => chart.resize());
}

loadData();
</script>
</body>
</html>
