const fmtPct = n => (n >= 0 ? '+' : '') + n.toFixed(2) + '%';
const clsVal = n => n > 0 ? 'pos' : n < 0 ? 'neg' : 'neu';

function makeDrawdown(curve, initial) {
  let peak = initial;
  return curve.map(p => {
    if (p.equity > peak) peak = p.equity;
    return ((p.equity - peak) / peak) * 100;
  });
}
