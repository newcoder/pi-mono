const fmtPct = n => (n >= 0 ? '+' : '') + n.toFixed(2) + '%';
const clsVal = n => n > 0 ? 'pos' : n < 0 ? 'neg' : 'neu';

const metricsEl = document.getElementById('metrics');

  { label: '策略年化收益', value: fmtPct(REPORT.strategyMetrics.annualizedReturn), cls: clsVal(REPORT.strategyMetrics.annualizedReturn) },
  { label: '策略最大回撤', value: fmtPct(REPORT.strategyMetrics.maxDrawdown), cls: 'neg' },

  { label: '中证500总收益', value: fmtPct(REPORT.benchmarkMetrics.totalReturn), cls: clsVal(REPORT.benchmarkMetrics.totalReturn) },
  { label: '中证500最大回撤', value: fmtPct(REPORT.benchmarkMetrics.maxDrawdown), cls: 'neg' },
].map(m => '<div class="metric-card"><div class="label">' + m.label + '</div><div class="value ' + m.cls + '">' + m.value + '</div></div>').join('');

function makeDrawdown(curve, initial) {
  let peak = initial;
  return curve.map(p => {
    if (p.equity > peak) peak = p.equity;
    return ((p.equity - peak) / peak) * 100;
  });
}

const benchmarkData = REPORT.benchmarkCurve.map(p => p.equity);
const strategyDD = makeDrawdown(REPORT.strategyCurve, REPORT.initialCapital);
